<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donttblink's Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="js.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>The Great Library of Donttblinxandria</h1>
    </header>
    <aside>
      <button class="new-book">New Book</button>
      <form action="" method="get" class="book-form">
        <div class="form-row">
          <label for="book-name">Book Name</label>
          <input id="book-name" name="book-name" type="text" />
        </div>
        <div class="form-row">
          <label for="author-name">Author</label>
          <input id="author-name" name="author-name" type="text" />
        </div>
        <div class="form-row">
          <label for="book-length">Number of Pages</label>
          <input id="book-length" name="book-length" type="number" />
        </div>
        <div class="form-row">
          <label for="read">Read</label>
          <input id="read" name="read" type="checkbox" value="has-read" />
        </div>
        <div class="form-row">
          <button type="submit">Add Book</button>
        </div>
      </form>
    </aside>
    <main class="shelf"></main>
    <footer>
      <p>
        &copy; <span id="year"></span> DonttBlink Incorporated. All rights
        reserved.
      </p>
      <script>
        document.getElementById("year").textContent = new Date().getFullYear();
      </script>
    </footer>
  </body>
</html>
